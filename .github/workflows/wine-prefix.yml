name: Wine runtime source build (device validation separate)
on:
  workflow_dispatch:
    inputs:
      windows_display:
        description: Build the unqualified Windows Display candidate (no device claim)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  wine-prefix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Host build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential clang lld llvm flex bison gettext ninja-build autoconf
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Box64 from pinned source
        run: python3 scripts/build-box64.py --sdk "$ANDROID_HOME" --work "$RUNNER_TEMP/box64" --jobs 2
      - name: Original Windows fixtures
        run: scripts/build-windows-fixtures.sh
      - name: Wine from pinned source with reviewed portability patches
        env:
          FROST_JOBS: '2'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export GRADLE="$PWD/gradlew"
          scripts/build-wine-bionic.sh "$RUNNER_TEMP/wine"
          python3 scripts/package-wine-probe.py \
            --installed "$RUNNER_TEMP/wine/package/frostbox/wine" \
            --exe build/windows-fixtures/console-x64.exe \
            --source "$RUNNER_TEMP/wine/wine-wine-11.19" \
            --strip "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          cp "$RUNNER_TEMP/wine/wine-11.19.tar.gz" build/Wine-11.19-upstream-source.tar.gz
      - name: Experimental display from source
        if: inputs.windows_display
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export FROST_JOBS=2
          scripts/build-compat-lab.sh
          scripts/build-display-driver.sh "$RUNNER_TEMP/wine"
      - name: Build and host checks (no Android execution claim)
        run: |
          ./gradlew -PwithBox64=true -PwithWineProbe=true -PwithWindowsDisplay=${{ inputs.windows_display }} :core:test :android-app:testDebugUnitTest :android-app:lintDebug :android-app:assembleDebug :android-app:assembleDebugAndroidTest
          cmake -S runtime/native -B build/native -G Ninja
          cmake --build build/native -j2
          ctest --test-dir build/native --output-on-failure
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frostbox-0.4.0-dev.1-source-build-display-${{ inputs.windows_display }}
          path: |
            android-app/build/outputs/apk/
            android-app/build/reports/
            build/Wine-11.19-upstream-source.tar.gz
            third-party/patches/
            third-party/licenses/
            scripts/build-wine-bionic.sh
            scripts/package-wine-probe.py
            build/wine-probe-package/assets/runtime/*.json
            runtime/display/
            scripts/build-display-driver.sh
            scripts/build-display-freetype.py
            scripts/finish-display-validation.sh
            scripts/build-compat-lab.sh
            build/windows-fixtures/gui-x64.exe
            build/display-package/assets/display/manifest.json
            build/display-package/assets/display/licenses/
            ${{ runner.temp }}/wine-display/freetype/freetype-2.14.3.tar.xz
