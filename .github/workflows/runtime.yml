name: Runtime source build
on: workflow_dispatch
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build pinned Box64 source
        run: python3 scripts/build-box64.py --sdk "$ANDROID_HOME" --work "$RUNNER_TEMP/box64-source" --jobs 2
      - name: Build APK and device tests (device execution is separate)
        run: ./gradlew -PwithBox64=true :core:test :android-app:testDebugUnitTest :android-app:assembleDebug :android-app:assembleDebugAndroidTest :android-app:lintDebug
      - name: Host process tests
        run: |
          cmake -S runtime/native -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/native -j2
          ctest --test-dir build/native --output-on-failure
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frostbox-runtime-dev
          path: |
            android-app/build/outputs/apk/
            android-app/build/reports/
            build/box64-package/assets/runtime/box64.json
