name: Android Checks
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Source privacy and artifact gate
        run: python3 scripts/check-source.py
      - name: Install pinned SDK tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Kotlin, Android, native build and lint
        run: ./gradlew :core:test :android-app:testDebugUnitTest :android-app:assembleDebug :android-app:lintDebug --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frostbox-shell-debug-and-reports
          path: |
            android-app/build/outputs/apk/debug/*.apk
            android-app/build/reports/
            core/build/reports/
